[project]
name = 'vision-math-transformer'
experiment_name = "base"

[data]
raw_dir = 'data/raw'
split_dir = 'data/splits'
batch_size = 32
num_workers = 4
image_size = [128,128]
seed = 1008

[model]
num_layers = 4
dropout = 0.1
dim_ratio = 4
num_heads = 4
patch_size = 16
n_embd = 256
max_seq_len = 6

[training]
lr = 1e-4
weight_decay = 0.1
warmup_steps = 500
betas = [0.9, 0.5]
grad_clip = 1.0
val_every_steps = 500
vis_every_steps = 500
scheduler = 'cosine'
max_steps = 10000

[logging]
use_wandb = true
project_name = "Vision-math-transformer"
assets_dir = 'assets'